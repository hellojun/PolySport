[project]
name = "polysport-backend"
version = "0.2.0"
description = "PolySport - AI Sports Prediction Engine powered by Multi-Agent Debate"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PolySport Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # 数据库 & 认证
    "flask-sqlalchemy>=3.1.0",
    "flask-jwt-extended>=4.6.0",
    "psycopg2-binary>=2.9.0",
    "google-auth>=2.30.0",

    # Redis
    "redis>=5.0.0",

    # LLM
    "openai>=1.0.0",

    # Zep Cloud
    "zep-cloud==3.13.0",

    # NBA 数据
    "nba_api>=1.4.1",

    # Polygon (链上聪明钱)
    "web3>=6.0.0",

    # 文件处理
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # 调度器
    "apscheduler>=3.10.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Production WSGI
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
