services:
  postgres:
    image: postgres:16-alpine
    container_name: mirofish-postgres
    environment:
      POSTGRES_DB: mirofish
      POSTGRES_USER: mirofish
      POSTGRES_PASSWORD: mirofish
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mirofish-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
