<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#17408B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8612D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8612D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
  </g>

  <!-- Accent glow on right -->
  <rect x="900" y="0" width="600" height="500" fill="url(#accent)"/>

  <!-- Large decorative basketball (right side, partially clipped) -->
  <g transform="translate(1280, 250)" opacity="0.08">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#fff" stroke-width="3"/>
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#fff" stroke-width="2.5"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#fff" stroke-width="2.5"/>
    <path d="M-160,-150c80,60,80,240,0,300" stroke="#fff" stroke-width="2.5" fill="none"/>
    <path d="M160,-150c-80,60-80,240,0,300" stroke="#fff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Small decorative basketball (left) -->
  <g transform="translate(120, 380)" opacity="0.06">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#fff" stroke-width="1.5"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#fff" stroke-width="1.5"/>
    <path d="M-72,-68c36,27,36,109,0,136" stroke="#fff" stroke-width="1.5" fill="none"/>
    <path d="M72,-68c-36,27-36,109,0,136" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Logo basketball icon -->
  <g transform="translate(390, 250)">
    <circle cx="0" cy="0" r="36" fill="#E8612D" stroke="#fff" stroke-width="2"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#fff" stroke-width="1.5"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#fff" stroke-width="1.5"/>
    <path d="M-26,-25c15,10,15,40,0,50" stroke="#fff" stroke-width="1.5" fill="none"/>
    <path d="M26,-25c-15,10-15,40,0,50" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Brand name -->
  <text x="450" y="262" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="2">PolySport</text>

  <!-- Tagline -->
  <text x="393" y="300" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="14" fill="#888" letter-spacing="3" text-transform="uppercase">MULTI-AGENT DEBATE  ×  KNOWLEDGE GRAPH  ×  SMART MONEY</text>

  <!-- Decorative line -->
  <line x1="390" y1="205" x2="580" y2="205" stroke="#E8612D" stroke-width="2" opacity="0.6"/>

  <!-- Corner accents -->
  <line x1="40" y1="40" x2="100" y2="40" stroke="#E8612D" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="40" x2="40" y2="100" stroke="#E8612D" stroke-width="2" opacity="0.4"/>
  <line x1="1460" y1="460" x2="1400" y2="460" stroke="#E8612D" stroke-width="2" opacity="0.4"/>
  <line x1="1460" y1="460" x2="1460" y2="400" stroke="#E8612D" stroke-width="2" opacity="0.4"/>
</svg>
