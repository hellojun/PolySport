            "@type": "Answer",

        },

          "@type": "Question",
          "name": "What is multi-agent debate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PolySport employs 7 specialized AI analyst agents — each with unique cognitive biases — who debate across 2 rounds. This structured debate produces a weighted consensus prediction rather than relying on a single model."
          }
        },
        {
          "@type": "Question",
          "name": "What is on-chain smart money?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On-chain smart money refers to tracking high-performing wallets on Polymarket's blockchain-based prediction market. PolySport analyzes their position sizing, entry timing, and directional bets to gauge informed conviction on game outcomes."
          }
        },
        {
          "@type": "Question",
          "name": "Is PolySport free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PolySport offers a free tier with limited daily predictions. For unlimited access, advanced analytics, and priority processing, monthly subscription plans are available from the Account page."
          }
        },
        {
          "@type": "Question",
          "name": "How does the knowledge graph work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PolySport's knowledge graph models the NBA domain with 10 entity types (teams, players, games, injuries, standings, etc.) and 8 relation types (plays_for, injured_in, matchup_history, etc.). This structured representation enables analysts to reason over complex relationships rather than flat statistics."
          }
        },

          "@type": "Question",
          "name": "What sports will PolySport support next?",
