# Nginx snippet: serve prerendered HTML to search/AI crawlers
# Add this INSIDE your existing server { } block, BEFORE the SPA fallback location /

# Detect crawlers via User-Agent
map $http_user_agent $is_crawler {
    default                 0;
    "~*Googlebot"           1;
    "~*Bingbot"             1;
    "~*baiduspider"         1;
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*ClaudeBot"           1;
    "~*PerplexityBot"       1;
    "~*Applebot"            1;
    "~*YandexBot"           1;
    "~*Slurp"               1;
    "~*DuckDuckBot"         1;
    "~*facebookexternalhit" 1;
    "~*Twitterbot"          1;
    "~*LinkedInBot"         1;
}

